name: Build instructions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  instructions:
    runs-on: ubuntu-latest
    steps:
      - name: Show canonical build entry
        run: |
          echo 'This repository is a UI overlay, not a full Flutter project.'
          echo 'Apply scripts/apply_to_host.py to the complete host.'
          echo 'Build: oh5uosnvh/flclash-private, release/A01, manual-build.yaml'
          echo 'Select platform=both and run_checks=true; keep the pinned kernel_ref.'
          echo 'Release: https://github.com/oh5uosnvh/flclash-UI/releases/tag/A01'
